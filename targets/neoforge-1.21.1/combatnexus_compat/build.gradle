plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = 'io.github.fatalitaya.combatnexus'
version = rootProject.version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge.version = rootProject.neoforge_121_version

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    // Deliberately depend on classes, never the Jar that embeds this project.
    compileOnly files(rootProject.sourceSets.main.output.classesDirs)
    compileOnly 'curse.maven:apotheosis-313970:8993983'
    compileOnly 'curse.maven:apothic-attributes-898963:9006294'
    compileOnly 'curse.maven:placebo-283644:9153039'
}
tasks.named('compileJava') { dependsOn rootProject.tasks.named('compileJava') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    from(rootProject.file('../../LICENSE'))
    manifest.attributes 'Automatic-Module-Name': 'io.github.fatalitaya.combatnexus.compat'
}
