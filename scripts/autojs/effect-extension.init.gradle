allprojects {
    afterEvaluate {
        if (projectDir.name == 'neoforge-26.1.2') {
            sourceSets {
                effectProbe {
                    java.srcDir '../../scripts/autojs/effect-extension/java'
                    resources.srcDir '../../scripts/autojs/effect-extension/resources'
                    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
                }
            }
            if (providers.gradleProperty('verificationPackaged').map { it.toBoolean() }.getOrElse(false)) {
                def probeJar = tasks.register('effectProbeJar', Jar) {
                    archiveBaseName = 'combatnexus-effect-probe'
                    from sourceSets.effectProbe.output
                }
                dependencies.add('runtimeOnly', files(probeJar))
            } else {
                neoForge.mods.create('combatnexus_effect_probe') { sourceSet(sourceSets.effectProbe) }
            }
        }
    }
}
