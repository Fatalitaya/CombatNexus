// Applied from an individual target project, not from the aggregate root project.
apply plugin: 'maven-publish'

repositories {
    flatDir {
        dirs layout.projectDirectory.dir('libs')
    }
}

dependencies {
    implementation fileTree(dir: file('libs'), include: ['*.jar'], exclude: ['*-sources.jar', '*-javadoc.jar'])
}

// common/ is a shared source tree compiled into this target via source-set
// sharing (not an included Gradle project), so the shared resources directory is
// referenced by relative path instead of project(':common').
sourceSets.main.resources.srcDir file('../../common/src/main/resources')

tasks.named('jar', Jar).configure {
    from('../../LICENSE')
}

// Ship the shared documentation inside the mod jar at the jar root, next to
// assets/ (e.g. docs/en/getting-started.md). Targets without that directory are
// unaffected.
tasks.named('processResources', ProcessResources).configure {
    from('../../docs/en') {
        into 'docs/en'
    }
}

def publishLoader = 'neoforge'
def publishMinecraftVersion = project.ext.publishMinecraftVersion.toString()
def publicationVersion = project.version.toString()
def snapshot = publicationVersion.endsWith('-SNAPSHOT')
def publicationEnabled = project.ext.publicationEnabled
def publicationTarget = project.name
def repositoryName = snapshot ? 'maven-snapshots' : 'maven-releases'
def publishUrl = providers.environmentVariable('COMBATNEXUS_MAVEN_URL')
        .getOrElse("https://maven.sighs.cc/repository/${repositoryName}/").trim()
def publishFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
def configuredCurseforgeProjectId = findProperty('publish_curseforge_project_id')?.toString()
def configuredModrinthProjectId = findProperty('publish_modrinth_project_id')?.toString()
def curseforgeProjectId = providers.provider { configuredCurseforgeProjectId }
        .orElse(providers.environmentVariable('CURSEFORGE_PROJECT_ID'))
def modrinthProjectId = providers.provider { configuredModrinthProjectId }
        .orElse(providers.environmentVariable('MODRINTH_PROJECT_ID'))

publishMods {
    file = publishFile
    version = publicationVersion
    displayName = "${project.mod_name} ${publicationVersion} (NeoForge ${publishMinecraftVersion})"
    changelog = providers.environmentVariable('PUBLISH_CHANGELOG').getOrElse('See the project changelog for details.')
    type = snapshot ? ALPHA : STABLE
    modLoaders.add(publishLoader)

    curseforge {
        projectId = curseforgeProjectId
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(publishMinecraftVersion)
        client = true
        server = true
    }

    modrinth {
        projectId = modrinthProjectId
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(publishMinecraftVersion)
    }
}

def validatePublication = tasks.register('validatePublication') {
    doLast {
        if (!publicationEnabled) {
            throw new GradleException("Publication of the ${publicationTarget} development target is disabled.")
        }
    }
}

[
        Curseforge: [
                'publish_curseforge_project_id (or CURSEFORGE_PROJECT_ID)': curseforgeProjectId,
                'CURSEFORGE_TOKEN': providers.environmentVariable('CURSEFORGE_TOKEN')
        ],
        Modrinth: [
                'publish_modrinth_project_id (or MODRINTH_PROJECT_ID)': modrinthProjectId,
                'MODRINTH_TOKEN': providers.environmentVariable('MODRINTH_TOKEN')
        ]
].each { platform, required ->
    // Capture values during configuration; execution must not access Project.
    def missing = required.findAll { _, value -> !value.present || value.get().trim().isEmpty() }.keySet().toList()
    def validatePlatform = tasks.register("validate${platform}Publication") {
        dependsOn validatePublication
        doLast {
            if (!missing.isEmpty()) {
                throw new GradleException("Cannot publish to ${platform}; missing: ${missing.join(', ')}")
            }
        }
    }
    tasks.named("publish${platform}").configure { dependsOn validatePlatform }
    // Validate both destinations before either upload when using the aggregate.
    tasks.named('publishMods').configure { dependsOn validatePlatform }
    tasks.matching { it.name in ['publishCurseforge', 'publishModrinth'] }.configureEach {
        mustRunAfter validatePlatform
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()

            // Loader and Minecraft dependencies are supplied by the game runtime,
            // so the published mod POM must not expose the target build classpath.
            pom.withXml {
                def dependenciesNode = asNode().getAt('dependencies')[0]
                if (dependenciesNode != null) {
                    dependenciesNode.children().toList().each { dependency ->
                        dependenciesNode.remove(dependency)
                    }
                }
            }
        }
    }

    repositories {
        if (!publishUrl.isEmpty()) maven {
            name = 'remoteRepo'
            url = uri(publishUrl)
            credentials {
                username = providers.environmentVariable('COMBATNEXUS_MAVEN_USER')
                        .orElse(providers.environmentVariable('SIGHS_PUBLISH_USER'))
                        .orElse(providers.gradleProperty('combatnexusMavenUser')).orNull
                password = providers.environmentVariable('COMBATNEXUS_MAVEN_PASSWORD')
                        .orElse(providers.environmentVariable('SIGHS_PUBLISH_PASSWORD'))
                        .orElse(providers.gradleProperty('combatnexusMavenPassword')).orNull
            }
        }
    }
}

def validateMavenPublication = tasks.register('validateMavenPublication') {
    dependsOn validatePublication
    doLast {
        if (publishUrl.isEmpty()) {
            throw new GradleException('Cannot publish to Maven; set COMBATNEXUS_MAVEN_URL to the release or snapshot repository URL.')
        }
    }
}

tasks.named('publish').configure {
    dependsOn validateMavenPublication
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn validateMavenPublication
    // Always upload again. Overwriting releases requires Allow redeploy on the server;
    // Maven snapshots retain the standard timestamped deployment behavior.
    outputs.upToDateWhen { false }
}
tasks.withType(PublishToMavenLocal).configureEach {
    enabled = false
}
tasks.named('publishToMavenLocal').configure {
    enabled = false
    setDependsOn([])
}

tasks.register('publishMavenSnapshot') {
    dependsOn {
        if (!snapshot) {
            throw new GradleException('publishMavenSnapshot requires a version ending in -SNAPSHOT.')
        }
        'publish'
    }
}

tasks.register('publishMavenRelease') {
    dependsOn {
        if (snapshot) {
            throw new GradleException('publishMavenRelease requires a version not ending in -SNAPSHOT.')
        }
        'publish'
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

def publishingEntrypoints = [
        publish: 'Uploads to the configured Maven repository; redeploys existing coordinates if the server permits.',
        publishMavenSnapshot: 'Uploads a SNAPSHOT to the configured Maven repository with standard Maven timestamps.',
        publishMavenRelease: 'Uploads a release to the configured Maven repository; redeploys existing coordinates if the server permits.',
        publishCurseforge: 'Uploads to CurseForge using its project ID and token.',
        publishModrinth: 'Uploads to Modrinth using its project ID and token.',
        publishMods: 'Uploads to both CurseForge and Modrinth (does not publish Maven).'
]
tasks.configureEach {
    if (publishingEntrypoints.containsKey(name)) {
        group = 'publishing'
        description = publishingEntrypoints[name] + (publicationEnabled ? '' : ' [Disabled for this development target.]')
    } else if (group == 'publishing') {
        // Keep generated tasks callable, but expose only the intended entrypoints.
        group = null
    }
}
