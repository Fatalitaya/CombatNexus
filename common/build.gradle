// Platform-independent shared library; no release jar or target dependency.
plugins {
    id 'java-library'
}
def shared = new Properties()
file('../gradle.properties').withInputStream { shared.load(it) }
file('gradle.properties').withInputStream { shared.load(it) }
shared.each { key, value -> ext.set(key.toString(), value.toString()) }
group = mod_group_id
version = mod_version
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
}
dependencies {
    api 'com.mojang:datafixerupper:9.0.19'
    api 'com.google.code.gson:gson:2.13.2'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.jetbrains:annotations:26.0.2-1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

tasks.named('jar') { enabled = false }

// Guard the actual configured source sets, not only the checked-in directory layout.
tasks.register('verifySourceIsolation') {
    doLast {
        [sourceSets.main.java, sourceSets.main.resources].each { sources ->
            sources.srcDirs.each { directory ->
                if (!directory.toPath().toAbsolutePath().normalize().startsWith(
                        file('src/main').toPath().toAbsolutePath().normalize())) {
                    throw new GradleException("common must not compile external sources/resources: ${directory}")
                }
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifySourceIsolation' }
tasks.named('processResources') { dependsOn 'verifySourceIsolation' }
